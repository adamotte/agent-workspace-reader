name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test "tests/*.test.mjs"

      - run: pnpm build

      - id: version
        run: echo "version=$(node -p "require('./extension/manifest.json').version_name")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-reader-${{ steps.version.outputs.version }}
          path: dist/agent-workspace-reader-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    # Publish every commit on main as a release named after the commit's day
    # (UTC), with the short commit hash appended when the day already has one.
    # The zip keeps the full version, day and hash, as in its manifest.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-workspace-reader-${{ env.VERSION }}
          path: dist

      - name: Create the release
        run: |
          exists() { gh release view "$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; }
          tag="${VERSION%%-*}"
          if exists "$tag"; then
            tag="$VERSION"
          fi
          if exists "$tag"; then
            echo "Release $tag already exists, nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            "dist/agent-workspace-reader-$VERSION.zip"
